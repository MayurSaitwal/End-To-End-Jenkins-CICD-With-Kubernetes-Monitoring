services:
  flask-app:
    build: .
    container_name: restaurant-flask
    ports:
      - "8080:5000"
    environment:
      SECRET_KEY: restaurant_secret_key_2024
      MYSQL_HOST: mysql-service
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: restaurant_db
      MYSQL_PORT: 3306
    depends_on:
      - mysql-service

  mysql-service:
    image: mysql:5.7
    container_name: restaurant-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: restaurant_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro

volumes:
  mysql_data: